# This GitHub Actions workflow runs tests for the `zbynekstara-npm-test` repository.
name: Test PR

# Trigger this workflow on:
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Cancel in-progress runs on new commits
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job to run tests
  test:
    if: ${{ github.repository == 'zbynekstara/zbynekstara-npm-test' }}
    runs-on: ubuntu-latest
    steps:
      # Checkout repo contents
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install environment packages (parity with joint - CJK fonts for its
      # util.breakText text tests; a harmless no-op here, safe to drop).
      - name: Install environment packages
        id: install-environment-packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: |
            fonts-arphic-ukai \
            fonts-arphic-uming \
            fonts-ipafont-mincho \
            fonts-ipafont-gothic \
            fonts-unfonts-core \
            fonts-noto-core
          version: 1.0

      # Set up Node.js version for building
      - name: Setup Node.js v22
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      # Cache Yarn packages to speed up CI
      - name: Cache Yarn
        id: cache-yarn
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
          key: yarn-cache-${{ hashFiles('yarn.lock') }}

      # Install all dependencies
      - name: Install dependencies
        id: install-dependencies
        run: yarn install --immutable

      # Changing releasable code in a public package must provide a changeset
      # (Releasable files are configured in `.changeset/config.json`)
      # (Call `yarn changeset --empty` for a PR without releasable code)
      - name: Check changeset
        id: check-changeset
        # Release PR is skipped - it consumes all changesets instead
        if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/') }}
        # Compare PR to current committed master
        run: |
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          yarn changeset status --since=origin/master

      # Build the project
      - name: Prepare
        id: prepare
        run: yarn run dist

      # Test the project
      - name: 'Test'
        id: test
        run: yarn run test

      # Lint the project
      - name: 'Lint'
        id: lint
        run: yarn run lint
